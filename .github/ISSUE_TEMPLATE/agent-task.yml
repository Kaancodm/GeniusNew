name: Begrenzte Aufgabe
description: Ein direkt bearbeitbarer Auftrag mit sechs Angaben für eine Person oder einen Assistenten (Codex, Gemini, Copilot).
title: "task: "
body:
  - type: markdown
    attributes:
      value: |
        Dieses Repository ist öffentlich. Keine Zugangsdaten, privaten Endpunkte,
        persönlichen Unterlagen oder sensiblen Schwachstellendetails eintragen.
        Rollen, Merge-Regeln und die sechs Angaben: docs/COLLABORATION.md („Der Auftrag“).
        Entschiedenes als entschieden eintragen, Offenes als offene Entscheidung.
  - type: textarea
    id: outcome
    attributes:
      label: Ziel
      description: Was nachher konkret funktioniert, und warum es nötig ist.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Ausgangslage
      description: Voller Baseline-SHA, relevante Dateien, Entscheidungen (docs/DECISIONS.md) und Befunde.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Umfang
      description: Dateien oder Verhalten im Umfang, zu erhaltende Arbeit, ausdrückliche Ausschlüsse.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahme
      description: Beobachtbares Ergebnis, Prüfbefehle, erwartetes Ablehnungsverhalten.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Abhängigkeiten
      description: |
        Was vorher vorliegen muss, zum Beispiel ein gemergter PR, das gemergte
        docs/DATABASE.md (DB-Code) oder Kaans OK (Ausnahmen). Die Wissenspflege ist
        keine Abhängigkeit.
      value: keine
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Verantwortlich (genau ein Implementierer)
      options:
        - Codex (Umsetzung)
        - Gemini Pro (Datenbank / Wissensdatenbank)
        - Copilot (begrenzte Umsetzung auf eigenem Branch)
        - Claude Code (Ordnung / Konflikt)
    validations:
      required: true
  - type: textarea
    id: approvals
    attributes:
      label: Prüfung und Freigaben
      description: Wer prüft, welche Freigabe nötig ist (DB-PR, Ausnahme), welche Entscheidung Kaans noch offen ist.
      value: |
        Prüfung: Gemini und Copilot am PR, auf dem aktuellen Head-SHA.
        Freigaben: keine über docs/COLLABORATION.md hinaus.
        Offene Entscheidungen: keine
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Übergabe
      value: |
        Draft-PR mit vollem Head-SHA, Diff-Zusammenfassung, tatsächlich ausgeführten
        Prüfungen, offenen Grenzen und dem Wissensblock. Merge nach docs/COLLABORATION.md.
    validations:
      required: true
