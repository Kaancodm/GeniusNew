name: Verify contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # Disposable CI database only; no production credentials or external endpoint.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: geniusnew_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geniusnew_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GENIUSNEW_TEST_ADMIN_DSN: "host=127.0.0.1 port=5432 dbname=geniusnew_test_admin user=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client library
        run: sudo apt-get update && sudo apt-get install -y libpq5
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run contract tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run demo after tests
        run: ./scripts/demo.sh

  guarded:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Read from the guard itself, so the matrix cannot drift from GUARDED.
      - id: list
        run: >-
          echo "modules=$(python -c 'import json; from scripts.refusals import GUARDED;
          print(json.dumps(list(GUARDED)))')" >> "$GITHUB_OUTPUT"

  refusals:
    needs: guarded
    runs-on: ubuntu-latest
    name: refusals (${{ matrix.module }})
    # Disposable CI database only; no production credentials or external endpoint.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: geniusnew_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geniusnew_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GENIUSNEW_TEST_ADMIN_DSN: "host=127.0.0.1 port=5432 dbname=geniusnew_test_admin user=postgres"
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.guarded.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client library
        run: sudo apt-get update && sudo apt-get install -y libpq5
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Every refusal must have a test that notices its removal
        env:
          MODULE: ${{ matrix.module }}
        run: python scripts/refusals.py "$MODULE"

  # The check name branch protection may require. A skipped job counts as
  # passing there, so this runs always and demands success from both.
  contracts:
    needs: [tests, refusals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tests and every refusal check passed
        env:
          TESTS: ${{ needs.tests.result }}
          REFUSALS: ${{ needs.refusals.result }}
        run: |
          echo "tests=$TESTS refusals=$REFUSALS"
          test "$TESTS" = success && test "$REFUSALS" = success
