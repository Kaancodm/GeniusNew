name: Verify contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    # Disposable CI database only; no production credentials or external endpoint.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: geniusnew_test_admin
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d geniusnew_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Configure disposable PostgreSQL
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          case "$POSTGRES_PORT" in
            ''|0*|*[!0-9]*|??????*) echo "Invalid PostgreSQL service port" >&2; exit 1 ;;
          esac
          if [ "$POSTGRES_PORT" -lt 1 ] || [ "$POSTGRES_PORT" -gt 65535 ]; then
            echo "Invalid PostgreSQL service port" >&2
            exit 1
          fi
          printf 'GENIUSNEW_TEST_ADMIN_DSN=host=127.0.0.1 port=%s dbname=geniusnew_test_admin user=postgres\n' "$POSTGRES_PORT" >> "$GITHUB_ENV"
      - name: Install PostgreSQL client library
        run: sudo apt-get update && sudo apt-get install -y libpq5
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run contract tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run demo after tests
        run: ./scripts/demo.sh
      - name: Refuse persistence attacks after the HTTP demo
        run: python scripts/demo_persistence.py
      - name: Restore a disposable database against its independent anchor
        env:
          GENIUSNEW_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python scripts/demo_restore.py

  guarded:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      # Read from the guard itself, so the matrix cannot drift from GUARDED.
      - id: list
        run: >-
          echo "modules=$(python -c 'import json; from scripts.refusals import GUARDED;
          print(json.dumps(list(GUARDED)))')" >> "$GITHUB_OUTPUT"

  refusals:
    needs: guarded
    runs-on: ubuntu-latest
    name: refusals (${{ matrix.module }})
    # Disposable CI database only; no production credentials or external endpoint.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: geniusnew_test_admin
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d geniusnew_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.guarded.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Configure disposable PostgreSQL
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          case "$POSTGRES_PORT" in
            ''|0*|*[!0-9]*|??????*) echo "Invalid PostgreSQL service port" >&2; exit 1 ;;
          esac
          if [ "$POSTGRES_PORT" -lt 1 ] || [ "$POSTGRES_PORT" -gt 65535 ]; then
            echo "Invalid PostgreSQL service port" >&2
            exit 1
          fi
          printf 'GENIUSNEW_TEST_ADMIN_DSN=host=127.0.0.1 port=%s dbname=geniusnew_test_admin user=postgres\n' "$POSTGRES_PORT" >> "$GITHUB_ENV"
      - name: Install PostgreSQL client library
        run: sudo apt-get update && sudo apt-get install -y libpq5
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Every refusal must have a test that notices its removal
        env:
          MODULE: ${{ matrix.module }}
        run: python scripts/refusals.py "$MODULE"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the pinned CI lint tool
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check Python errors
        run: python -m ruff check --select E9,F .

  # The check name branch protection may require. A skipped job counts as
  # passing there, so this runs always and demands success from every gate.
  contracts:
    needs: [tests, refusals, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tests, every refusal check and lint passed
        env:
          TESTS: ${{ needs.tests.result }}
          REFUSALS: ${{ needs.refusals.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "tests=$TESTS refusals=$REFUSALS lint=$LINT"
          test "$TESTS" = success && test "$REFUSALS" = success && test "$LINT" = success
