# Alternative to the local-only file, never concatenate the two templates.
# Replace CIDR placeholders privately with the smallest approved client ranges.
# No deployment addresses belong in Git. TLS must be enabled on the server.
# hostssl enforces encryption, not the client's certificate-verification mode.
local   replication   all                                    reject
local   all           all                                    reject
hostssl geniusnew     genius_migrate      <MIGRATION_CLIENT_CIDR> scram-sha-256
hostssl geniusnew     genius_core         <CORE_CLIENT_CIDR>      scram-sha-256
hostssl geniusnew     genius_backup       <BACKUP_CLIENT_CIDR>    scram-sha-256
host    replication   all                 all                reject
host    all           all                 all                reject
