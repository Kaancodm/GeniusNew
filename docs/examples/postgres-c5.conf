# Review-only PostgreSQL 17 fragment for a dedicated, same-host C5 cluster.
# Do not overwrite existing configuration or enable it without Kaan's approval.
listen_addresses = ''
unix_socket_directories = '/run/geniusnew-postgresql'
unix_socket_group = 'geniusnew-db'
unix_socket_permissions = 0770
password_encryption = 'scram-sha-256'

# Merge with any approved preload list, never discard existing entries.
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
pg_stat_statements.track_planning = off
pg_stat_statements.save = off

# A remote deployment needs a separately reviewed private override:
# listen_addresses = '<APPROVED_DB_BIND_ADDRESS>'
# ssl = on
# ssl_cert_file = '<PRIVATE_CERTIFICATE_PATH>'
# ssl_key_file = '<PRIVATE_KEY_PATH>'
# ssl_min_protocol_version = 'TLSv1.2'
# Use postgres-c5-tcp.pg_hba.conf and client sslmode=verify-full.
# data_checksums is initialized by initdb --data-checksums, not set here.
