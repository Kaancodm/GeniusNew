# GeniusNew behind nginx: TLS and the limit on unauthenticated traffic live here,
# identity and the per-principal limits stay in the core. See docs/REVERSE-PROXY.md.
#
# Placeholders only: server_name, the certificate paths and the upstream port must be
# replaced. No key, certificate or address of a real deployment belongs in this file.
#
# Goes into the http context, e.g. /etc/nginx/conf.d/geniusnew.conf.

# Unauthenticated traffic has no principal the core could charge, so it is limited per
# client address here. Keep the rate above the core's per-principal rate (60/min): the
# core stays the one that decides per principal.
limit_req_zone  $binary_remote_addr zone=geniusnew_req:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=geniusnew_conn:10m;

upstream geniusnew_core {
    # listen_host and listen_port of the core; it only listens on loopback. max_conns
    # matches the core's connection cap (64): past it nginx answers 502 itself instead
    # of handing the core connections it would close unread.
    server 127.0.0.1:8080 max_conns=64;
}

# Deliberately no server on port 80: a client that sent its API key in the clear has
# already leaked it, and a redirect would only arrive after the key.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name geniusnew.example.org;

    ssl_certificate     /etc/ssl/geniusnew/fullchain.pem;
    ssl_certificate_key /etc/ssl/geniusnew/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    server_tokens off;

    # The core reads at most 16 KiB and refuses chunked bodies. nginx reads the whole
    # body first (proxy_request_buffering is on by default) and forwards it with a
    # Content-Length, so a chunked client still reaches the core, and anything larger
    # is refused here before it crosses.
    client_max_body_size    16k;
    client_body_buffer_size 16k;
    client_header_timeout   10s;
    client_body_timeout     10s;
    send_timeout            10s;
    keepalive_timeout       10s;

    limit_req  zone=geniusnew_req burst=20 nodelay;
    limit_conn geniusnew_conn 16;
    limit_req_status  429;
    limit_conn_status 429;

    # A job answers only after its worker has finished; a worker runs for at most
    # 30 seconds (wall_seconds in geniusnew/isolation.py).
    proxy_connect_timeout 2s;
    proxy_send_timeout    10s;
    proxy_read_timeout    45s;
    proxy_request_buffering on;

    # The default access log does not contain request headers. Never add
    # $http_authorization or $http_x_approval_token to a log_format: both are
    # credentials.

    location = /jobs {
        limit_except POST { deny all; }
        proxy_pass http://geniusnew_core;
    }

    location ~ "^/jobs/[A-Za-z0-9-]{1,64}/approve$" {
        limit_except POST { deny all; }
        proxy_pass http://geniusnew_core;
    }

    location / {
        return 404;
    }
}
